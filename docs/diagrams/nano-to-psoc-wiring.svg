<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="780" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Arduino Nano clone to PSoC 4125 SWD wiring</text>
<text x="500" y="62" text-anchor="middle" font-size="13" fill="#4b5563">Nano logic is 5 V. The shaver board runs at 3.3 V (VCCD 1.8 V, never driven). Dividers drop SWDCLK and SWDIO.</text>
<rect x="60" y="100" width="190" height="530" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="155" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Arduino Nano clone</text>
<text x="155" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">ATmega328P, 5 V logic</text>
<rect x="750" y="100" width="190" height="530" rx="10" fill="#1f2937" stroke="#111827" stroke-width="2"/>
<text x="845" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#f9fafb">CY8C4125LQI-S425</text>
<text x="845" y="150" text-anchor="middle" font-size="12" fill="#d1d5db">shaver board, 3.3 V logic</text>
<text x="238" y="200" text-anchor="end" font-size="14" font-weight="700" fill="#1e3a8a">D2 (PD2)</text>
<text x="762" y="200" text-anchor="start" font-size="14" font-weight="700" fill="#f9fafb">pin 13  SWDCLK</text>
<line x1="250" y1="195" x2="340" y2="195" stroke="#374151" stroke-width="2"/>
<rect x="340" y="183" width="80" height="24" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="380" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">1 kΩ</text>
<line x1="420" y1="195" x2="750" y2="195" stroke="#374151" stroke-width="2"/>
<circle cx="560" cy="195" r="4" fill="#374151"/>
<line x1="560" y1="195" x2="560" y2="220" stroke="#374151" stroke-width="2"/>
<rect x="548" y="220" width="24" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="580" y="255" font-size="14" font-weight="700" fill="#92400e">2 kΩ</text>
<line x1="560" y1="280" x2="560" y2="295" stroke="#374151" stroke-width="2"/>
<line x1="550" y1="295" x2="570" y2="295" stroke="#374151" stroke-width="2"/>
<line x1="553" y1="301" x2="567" y2="301" stroke="#374151" stroke-width="2"/>
<line x1="556" y1="307" x2="564" y2="307" stroke="#374151" stroke-width="2"/>
<text x="576" y="181" font-size="12" fill="#b45309">about 3.3 V when Nano drives 5 V</text>
<text x="238" y="335" text-anchor="end" font-size="14" font-weight="700" fill="#1e3a8a">D3 (PD3)</text>
<text x="762" y="335" text-anchor="start" font-size="14" font-weight="700" fill="#f9fafb">pin 12  SWDIO</text>
<line x1="250" y1="330" x2="340" y2="330" stroke="#374151" stroke-width="2"/>
<rect x="340" y="318" width="80" height="24" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="380" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">1 kΩ</text>
<line x1="420" y1="330" x2="750" y2="330" stroke="#374151" stroke-width="2"/>
<circle cx="560" cy="330" r="4" fill="#374151"/>
<line x1="560" y1="330" x2="560" y2="355" stroke="#374151" stroke-width="2"/>
<rect x="548" y="355" width="24" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="580" y="390" font-size="14" font-weight="700" fill="#92400e">2 kΩ</text>
<line x1="560" y1="415" x2="560" y2="430" stroke="#374151" stroke-width="2"/>
<line x1="550" y1="430" x2="570" y2="430" stroke="#374151" stroke-width="2"/>
<line x1="553" y1="436" x2="567" y2="436" stroke="#374151" stroke-width="2"/>
<line x1="556" y1="442" x2="564" y2="442" stroke="#374151" stroke-width="2"/>
<text x="576" y="316" font-size="12" fill="#b45309">about 3.3 V when Nano drives 5 V</text>
<text x="238" y="485" text-anchor="end" font-size="14" font-weight="700" fill="#1e3a8a">D4 (PD4)</text>
<text x="762" y="485" text-anchor="start" font-size="14" font-weight="700" fill="#f9fafb">pin 30  XRES</text>
<line x1="250" y1="480" x2="750" y2="480" stroke="#b91c1c" stroke-width="2"/>
<text x="500" y="466" text-anchor="middle" font-size="12" fill="#b91c1c">direct, driven low only, then released (chip pull-up to 3.3 V)</text>
<text x="238" y="575" text-anchor="end" font-size="14" font-weight="700" fill="#1e3a8a">GND</text>
<text x="762" y="575" text-anchor="start" font-size="14" font-weight="700" fill="#f9fafb">GND (any board ground)</text>
<line x1="250" y1="570" x2="750" y2="570" stroke="#111827" stroke-width="2"/>
<text x="155" y="610" text-anchor="middle" font-size="12" fill="#b91c1c">5V pin: NOT connected</text>
<text x="845" y="610" text-anchor="middle" font-size="12" fill="#fca5a5">VCCD (pin 31): never driven</text>
<text x="60" y="670" font-size="13" font-weight="700" fill="#111827">Notes</text>
<text x="72" y="692" font-size="12" fill="#374151">&#8226; Divider: Vout = 5 V x 2k / (1k + 2k) = 3.33 V, below the 3.8 V limit (VDD + 0.5 V). Verify resistor values before powering.</text>
<text x="72" y="710" font-size="12" fill="#374151">&#8226; SWDIO is bidirectional. The Nano pin sits on the 1k side, so the chip 3.3 V high reaches it as a valid logic high.</text>
<text x="72" y="728" font-size="12" fill="#374151">&#8226; Share ground only. Nano powered from USB, shaver board powered from its own 5 V charger. Starting point, not a validated design.</text>
</svg>