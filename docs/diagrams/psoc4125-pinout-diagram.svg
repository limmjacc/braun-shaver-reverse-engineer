<text x="60" y="850" font-size="16" font-weight="700" fill="#111827">Arduino Nano clone (5 V logic) to PSoC (3.3 V logic): wiring with level-dropping dividers</text>
<rect x="60" y="868" width="880" height="26" fill="#f3f4f6"/>
<text x="72" y="886" font-size="13" font-weight="700" fill="#374151">Nano pin</text>
