<text x="560" y="886" font-size="13" font-weight="700" fill="#374151">Chip pin</text>
<rect x="60" y="894" width="880" height="28" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="60" y="894" width="8" height="28" fill="#b45309"/>
<text x="78" y="913" font-size="14" fill="#111827">Nano D2 (PD2)</text>
<text x="330" y="913" font-size="14" fill="#111827">1k in series, 2k to GND</text>
<text x="560" y="913" font-size="14" fill="#111827">pin 13, SWDCLK (P3.3)</text>
<rect x="60" y="922" width="880" height="28" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="60" y="922" width="8" height="28" fill="#b45309"/>
<text x="78" y="941" font-size="14" fill="#111827">Nano D3 (PD3)</text>
<text x="330" y="941" font-size="14" fill="#111827">1k in series, 2k to GND</text>
<text x="560" y="941" font-size="14" fill="#111827">pin 12, SWDIO (P3.2)</text>
<rect x="60" y="950" width="880" height="28" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="60" y="950" width="8" height="28" fill="#b91c1c"/>
<text x="78" y="969" font-size="14" fill="#111827">Nano D4 (PD4)</text>
<text x="330" y="969" font-size="14" fill="#111827">direct, pulls low only</text>
<text x="560" y="969" font-size="14" fill="#111827">pin 30, XRES</text>
<rect x="60" y="978" width="880" height="28" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="60" y="978" width="8" height="28" fill="#374151"/>
<text x="78" y="997" font-size="14" fill="#111827">Nano GND</text>
<text x="330" y="997" font-size="14" fill="#111827">direct</text>
<text x="560" y="997" font-size="14" fill="#111827">shaver board GND</text>
<rect x="60" y="1006" width="880" height="28" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="60" y="1006" width="8" height="28" fill="#c2410c"/>
<text x="78" y="1025" font-size="14" fill="#111827">Nano 5V</text>
<text x="330" y="1025" font-size="14" fill="#111827">NOT connected</text>
<text x="560" y="1025" font-size="14" fill="#111827">(share ground only)</text>
<text x="60" y="1068" font-size="14" font-weight="700" fill="#b91c1c">Before connecting any signal wire</text>
<text x="72" y="1090" font-size="13" fill="#374151">&#8226; Measured: VDDD and VDDA are 3.3 V, VCCD is 1.8 V. A GPIO may not exceed VDD + 0.5 V (3.8 V).</text>
<text x="72" y="1110" font-size="13" fill="#374151">&#8226; The Nano drives 5 V. SWDCLK and SWDIO therefore pass through 1k / 2k dividers (about 3.3 V at the chip).</text>
<text x="72" y="1130" font-size="13" fill="#374151">&#8226; Share ground only. Do not connect the Nano 5V pin to the board. VCCD (pin 31) is never to be driven.</text>
<text x="72" y="1150" font-size="13" fill="#374151">&#8226; SWD does not function in Deep Sleep. Flash protection, if set, blocks memory reads.</text>
<text x="72" y="1170" font-size="13" fill="#374151">&#8226; Audit: pin map verified against the datasheet. The S425 suffix is not listed in the ordering table.</text>
